<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Setup</title>
<style>
  body {
    background-color: #030408;
    color: #f0f0f0;
    font-family: "Courier New", monospace;
    margin: 0;
    padding: 2rem;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  #terminal {
    white-space: pre;
    font-size: 14px;
    line-height: 1.2;
    text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
  }
  .hidden { display: none; }
  #login-prompt {
    margin-top: 20px;
    display: none;
  }
  input {
    background: transparent;
    border: none;
    color: #f0f0f0;
    font-family: inherit;
    font-size: inherit;
    outline: none;
    width: 300px;
  }
</style>
</head>
<body>

<div id="terminal"></div>

<div id="login-prompt">
  <div>node-1 login: <input type="text" id="username" autofocus autocomplete="off"></div>
  <div id="password-line" class="hidden">password: <input type="password" id="password" autocomplete="off"></div>
</div>

<script>
  // Adattamento JS del motore boot-log
  const W = 62;
  const MEMORY = 16384;
  const MEM_AT = 0.4;
  const TEST = 2;
  const SPIN = "|/-\\";
  const EIGHTHS = "░▏▎▍▌▋▊▉";

  const KERNEL = [
    [0, "kernel 6.8.0 starting on 8 cpus"],
    [0, "command line: root=/dev/sda2 ro quiet"],
    [0.004, "memory: 16384 MB available, 412 MB reserved"],
    [0.077, "smp: brought up 1 node, 8 cpus"],
    [0.082, "pci: probing bus 0000:00"],
    [0.047, "pci 0000:00:17.0: sata controller, 6 ports"],
    [0.087, "usb 1-1: new high speed device, number 2"],
    [0.022, "usb 1-4: new full speed device, number 3"],
    [0.084, "sd 0:0:0:0: [sda] 1000215216 sectors (512 GB)"],
    [0.002, " sda: sda1 sda2"],
    [0.107, "eth0: link up, 1000 Mb/s, full duplex"],
    [0.129, "ext4: mounted sda2 read-only"],
    [0.062, "init: running /sbin/init"],
  ];
  const SERVICES = [
    [0.35, "[  OK  ] mounted root file system"],
    [0.12, "[  OK  ] started file system check on sda1"],
    [0.08, "[  OK  ] reached target local file systems"],
    [0.2, "[  OK  ] started journal service"],
    [0.1, "[  OK  ] started device manager"],
    [0.06, "[  OK  ] created runtime directories"],
    [0.15, "[  OK  ] started load kernel modules"],
    [0.25, "[ WARN ] clock not synced, using hardware time"],
    [0.2, "[  OK  ] started system logger"],
    [0.08, "[  OK  ] reached target sockets"],
    [0.1, "[  OK  ] reached target basic system"],
    [0.15, "[  OK  ] finished waiting for network", 2.6],
    [0.1, "[  OK  ] reached target network"],
    [0.25, "[  OK  ] synced clock to network time"],
    [0.1, "[  OK  ] started secure shell server"],
    [0.08, "[  OK  ] started job scheduler"],
    [0.1, "[  OK  ] started print spooler"],
    [0.3, "[  OK  ] reached target multi-user system"],
    [0.5, ""],
    [0.1, "node-1 login: "],
  ];

  let startTime = performance.now();
  let entries = [];
  let loginReached = false;

  const row = (label, detail, status = "") => {
    const left = label.padEnd(11) + detail;
    return left + status.padStart(W - left.length);
  };

  const tested = (now) => Math.min(1, Math.max(0, (now - MEM_AT) / TEST));

  function buildEntries() {
    let at = 0;
    const put = (text) => entries.push({ at, text: typeof text === "string" ? () => text : text });

    at = 0.12; put(row("system firmware 2.31.0", "", "self test"));
    at += 0.04; put("─".repeat(W));
    at += 0.04; put(row("cpu", "4 cores, 8 threads at 2.40 GHz", "ok"));
    at += 0.04; put(row("cache", "l1 256 KB   l2 2 MB   l3 8 MB", "ok"));
    at += 0.04;
    put((now) => {
      const f = tested(now);
      const mb = Math.floor(f * MEMORY);
      return row("memory", String(mb).padStart(5) + " MB of " + MEMORY + " MB", f < 1 ? "testing" : "ok");
    });
    put((now) => {
      const f = tested(now);
      const fill = f * 32;
      const full = Math.floor(fill);
      const bar = ("█".repeat(full) + (full < 32 ? EIGHTHS[Math.floor((fill - full) * 8)] : "")).padEnd(32, "░");
      const top = MEMORY * 1048576;
      const addr = f < 1 ? Math.floor((f * top) / 4096) * 4096 : top - 1;
      const hex = "0x" + addr.toString(16).toUpperCase().padStart(9, "0");
      return " ".repeat(11) + bar + "  " + hex + (Math.floor(f * 100) + "%").padStart(W - 56);
    });
    at += 0.04; put(row("display", "1920 x 1080 at 60 Hz", "ok"));
    at += 0.04; put(row("storage", "sata 0: disk 0, 512 GB", "ok"));
    at += 0.04; put(row("usb", "2 controllers, 2 devices", "ok"));
    at += 0.04; put(row("network", "1 port, 1000 Mb/s", "link up"));
    at += 0.04; put(row("sensors", "cpu 41°C   board 33°C   fan 2400 rpm", "ok"));
    at += 0.04; put(row("boot order", "disk 0, usb, network"));
    at += 0.04; put("─".repeat(W));
    at += 0.04; put("F2 setup    F12 boot menu    esc skip memory test");
    
    at = MEM_AT + TEST + 0.2; put("");
    at += 0.05; put("booting from disk 0");
    at += 0.2; put("loading kernel 6.8.0 ...");

    at += 0.3;
    let stamp = 0;
    for (const [gap, text] of KERNEL) {
      stamp += gap;
      at += gap * 1.5;
      const s = stamp ? stamp + Math.random() * 0.0009 : 0;
      put("[" + s.toFixed(6).padStart(12) + "] " + text);
    }

    for (const [gap, text, spin] of SERVICES) {
      at += gap;
      if (spin) {
        const from = at;
        put((now) => {
          const age = now - from;
          if (age >= spin) return text;
          const k = Math.floor(age * 8) % 6;
          const p = k < 4 ? k : 6 - k;
          const stars = (" ".repeat(p) + "***").padEnd(6);
          return "[" + stars + "] a start job is running for network (" + Math.floor(age + 5) + "s / 1min 30s)";
        });
        at += spin;
      } else put(text);
    }
    
    // Impostiamo il tempo di login un po' prima per non far aspettare troppo l'utente
    // Rispetto al .ts originale, accorciamo l'attesa
  }

  buildEntries();

  const term = document.getElementById("terminal");
  const loginPrompt = document.getElementById("login-prompt");
  const userInput = document.getElementById("username");
  const passLine = document.getElementById("password-line");
  const passInput = document.getElementById("password");

  function animate() {
    let now = (performance.now() - startTime) / 1000;
    
    // Velocizziamo il boot per non far annoiare l'utente (x2 velocità)
    now *= 2.5; 

    let lines = [];
    for (let e of entries) {
      if (e.at <= now) lines.push(e.text(now));
    }

    // Gestione fine boot / login
    const lastLine = entries[entries.length - 1];
    if (now >= lastLine.at && !loginReached) {
        loginReached = true;
        term.innerHTML = lines.map(l => `<div>${l}</div>`).join("");
        term.innerHTML += `<div>node-1 login: _</div>`;
        loginPrompt.style.display = "block";
        userInput.focus();
        return; // Ferma l'animazione
    }

    if (!loginReached) {
        term.innerHTML = lines.map(l => `<div>${l}</div>`).join("");
        requestAnimationFrame(animate);
    }
  }

  animate();

  // Logica di input utente
  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const username = userInput.value.trim();
      if (!username) return;
      userInput.disabled = true;
      userInput.parentElement.innerHTML = `node-1 login: ${username}`;
      passLine.classList.remove("hidden");
      passInput.focus();
    }
  });

  passInput.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
      passInput.disabled = true;
      passInput.parentElement.innerHTML = `password: ********`;
      
      term.innerHTML += `<div class="hidden" id="status-msg">Fetching hardware info... (please wait)</div>`;
      const statusMsg = document.getElementById("status-msg");
      statusMsg.classList.remove("hidden");

      try {
        // 1. Fetch hardware info dal server Python
        const res = await fetch('/api/sysinfo');
        const sysinfo = await res.json();

        // 2. Raccogli info browser
        const profileData = {
          username: userInput.value.trim(),
          browser: navigator.userAgent,
          os: sysinfo.os,
          cpu_cores: sysinfo.cpu_cores,
          ram_total: sysinfo.ram_total,
          ram_used: sysinfo.ram_used,
          setup_date: new Date().toISOString()
        };

        // 3. Salva sul server
        await fetch('/api/save-profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(profileData)
        });

        statusMsg.innerHTML = `<span style="color:#33ff66">[  OK  ] Profile saved. Redirecting to rest.home...</span>`;
        
        // 4. Redirect alla homepage
        setTimeout(() => {
          window.location.href = "/";
        }, 1500);

      } catch (err) {
        statusMsg.innerHTML = `<span style="color:#ff5555">[ FAIL ] Error connecting to local server. Is it running?</span>`;
      }
    }
  });
</script>

</body>
</html>
